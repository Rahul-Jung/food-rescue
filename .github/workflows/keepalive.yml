name: Keep-alive

# Zero-cost policy: free Supabase projects pause after a week without activity.
# One small read of app_settings_public every 3 days keeps staging and
# production awake. Uses only the public URL + anon key, stored as repo secrets.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [STAGING, PRODUCTION]
    steps:
      - name: Read app_settings_public
        env:
          URL: ${{ secrets[format('{0}_SUPABASE_URL', matrix.target)] }}
          KEY: ${{ secrets[format('{0}_SUPABASE_ANON_KEY', matrix.target)] }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "No secrets for ${{ matrix.target }} yet; skipping."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/app_settings_public?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "${{ matrix.target }} responded $status"
          test "$status" = "200"
